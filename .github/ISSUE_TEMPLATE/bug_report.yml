name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't paste private dictated text. The `idle:` status lines are safe to share.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `silentdictate doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status lines from `silentdictate run`
      render: text
  - type: input
    id: env
    attributes:
      label: OS, version and microphone
      placeholder: macOS 26, AirPods Pro
    validations:
      required: true
